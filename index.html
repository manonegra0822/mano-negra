<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Noticias políticas de Córdoba y Argentina, y cómo sus decisiones afectan las finanzas del país.">
<meta name="theme-color" content="#FFFFFF">
<title>Mano Negra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Diseño: cabecera con logo y fecha; lista de todas las notas a la izquierda;
     a la derecha, la nota más relevante del día (o la que se elija en la lista).
     Las tres fuentes son provisorias: se cambian solo en --f-display, --f-text y --f-ui. */
  :root {
    color-scheme: light;
    --paper: #FFFFFF;
    --paper-2: #F0F0F0;
    --ink: #000000;
    --ink-2: #525252;
    --line: #D2D2D2;
    --accent: #000000;
    --accent-ink: #FFFFFF;
    --c-cba: #1F3FD1;
    --c-arg: #45AEEA;
    --c-eco: #1E9E55;

    --f-display: 'Space Mono', 'Courier New', monospace;
    --f-text: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif;
    --f-ui: var(--f-text);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-text);
    font-size: 17px;
    line-height: 1.5;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell {
    display: grid;
    grid-template-columns: minmax(280px, 380px) minmax(0, 1fr) minmax(210px, 300px);
    grid-template-areas: "mast lead opinion" "list lead opinion";
    grid-template-rows: auto 1fr;
    column-gap: 0;
    padding-inline: clamp(16px, 3vw, 40px);
    padding-block: 24px 40px;
    max-width: 1500px;
    margin-inline: auto;
  }

  /* Cabecera */
  .mast { grid-area: mast; display: grid; gap: 14px; padding-bottom: 18px; padding-inline-end: clamp(20px, 3vw, 40px); border-bottom: 2px solid var(--ink); border-inline-end: 2px solid var(--ink); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { height: 96px; width: auto; flex: none; color: var(--ink); }
  .brand-name {
    margin: 0;
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 3.3rem;
    line-height: .95;
    letter-spacing: 0;
  }
  .tagline { margin: 0; font-family: var(--f-ui); font-size: .95rem; color: var(--ink-2); max-width: 34ch; }
  .dateline { margin: 0; font-family: var(--f-ui); font-size: .85rem; color: var(--ink-2); }
  .proto {
    margin: 0; font-family: var(--f-ui); font-size: .8rem; color: var(--ink);
    background: var(--paper-2); padding: 6px 10px; width: fit-content;
  }

  /* Lista de notas */
  .list { grid-area: list; min-width: 0; padding-top: 14px; padding-inline-end: clamp(20px, 3vw, 40px); border-inline-end: 2px solid var(--ink); }
  .filters { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 6px; padding: 0; list-style: none; }
  .filters button {
    background: none; border: 0; padding: 6px 0; cursor: pointer;
    font-family: var(--f-ui); font-size: .86rem; font-weight: 500; color: var(--ink-2);
    border-bottom: 2px solid transparent;
  }
  .filters button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .filters .n { font-weight: 400; margin-inline-start: 6px; }

  .notes { margin: 0; padding: 0; list-style: none; }
  .notes li { border-bottom: 1px solid var(--line); }
  .note-btn {
    display: grid; gap: 6px; width: 100%; text-align: start;
    background: none; border: 0; padding: 14px 10px 14px 12px; cursor: pointer;
    box-shadow: inset 0 0 0 0 var(--ink);
    transition: background-color .15s;
  }
  .note-btn:hover { background: var(--paper-2); }
  .note-btn[aria-current="true"] { background: var(--paper-2); box-shadow: inset 4px 0 0 0 var(--ink); }
  .note-top { display: flex; align-items: center; gap: 8px; font-family: var(--f-ui); font-size: .82rem; color: var(--ink-2); }
  .note-top .hora { margin-inline-start: auto; font-variant-numeric: tabular-nums; }
  .note-title { font-family: var(--f-display); font-weight: 700; font-size: .92rem; line-height: 1.35; text-wrap: balance; }
  .note-src { font-family: var(--f-ui); font-size: .82rem; color: var(--ink-2); }
  .foot { margin: 18px 0 0; font-family: var(--f-ui); font-size: .8rem; color: var(--ink-2); max-width: 44ch; }

  .mk { width: 10px; height: 10px; flex: none; display: inline-block; background: var(--ink); }
  .mk[data-s="cordoba"] { background: var(--c-cba); }
  .mk[data-s="argentina"] { background: var(--c-arg); transform: rotate(45deg) scale(.82); }
  .mk[data-s="economia"] { background: var(--c-eco); border-radius: 50%; }

  /* Nota principal */
  .lead { grid-area: lead; min-width: 0; align-self: start; position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100dvh; overflow: auto; padding-block: 8px 24px; padding-inline-start: clamp(24px, 4vw, 56px); }
  .kicker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--f-ui); font-weight: 600; font-size: .95rem; margin-bottom: 18px; }
  .back {
    background: none; border: 1px solid var(--ink); padding: 3px 10px; cursor: pointer;
    font-family: var(--f-ui); font-size: .85rem; font-weight: 500;
  }
  .back:hover { background: var(--ink); color: var(--paper); }
  .headline {
    margin: 0 0 18px; max-width: 30ch;
    font-family: var(--f-display); font-weight: 700;
    font-size: clamp(1.5rem, 0.9rem + 1.6vw, 2.2rem);
    line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; margin-bottom: 28px; font-family: var(--f-ui); font-size: .92rem; color: var(--ink-2); }
  .meta .sec { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; }
  .meta .src { color: var(--ink); font-weight: 600; }
  .badge { border: 1px solid var(--ink-2); padding: 1px 8px; font-size: .8rem; color: var(--ink); }

  .block { max-width: 62ch; margin-bottom: 26px; }
  .block h3{
    display: flex; align-items: baseline; gap: 12px; margin: 0 0 8px;
    font-family: var(--f-ui); font-weight: 600; font-size: .95rem; color: var(--ink);
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .block h3.t { margin-inline-start: auto; font-weight: 400; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .block p { margin: 0; }
  .quick p { font-size: 1.2rem; line-height: 1.6; }
  .impact p { font-size: 1.05rem; line-height: 1.55; color: var(--ink); }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; max-width: 62ch; }
  .go {
    display: inline-block; background: var(--accent); color: var(--accent-ink);
    font-family: var(--f-ui); font-weight: 600; font-size: 1rem; padding: 10px 18px; text-decoration: none;
  }
  .go:hover { background: var(--ink-2); }
  .go[aria-disabled="true"] { background: var(--paper-2); color: var(--ink-2); cursor: not-allowed; }
  .legal { font-family: var(--f-ui); font-size: .82rem; color: var(--ink-2); margin: 14px 0 0; max-width: 62ch; }

  .otros ul { margin: 0; padding: 0; list-style: none; }
  .otros li { padding: 8px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ui); font-size: .95rem; }
  .otros a { color: var(--ink); text-underline-offset: 3px; }

  /* Intro */
  .intro { display: none; }
  .intro-on .intro { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity .5s ease; }
  .intro.fuera { opacity: 0; pointer-events: none; }
  .intro-stage { display: flex; align-items: flex-end; gap: clamp(14px, 3vw, 34px); padding: 0 24px; }
  .intro-stage svg { height: min(46vh, 380px); width: auto; color: #000; flex: none; }
  .intro-name { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(2.6rem, 9vw, 6rem); line-height: .92; letter-spacing: -.02em; text-transform: none; opacity: 0; transform: translateX(-14px); transition: opacity .6s ease, transform .6s ease; padding-bottom: 4%; }
  .intro-name.ver { opacity: 1; transform: none; }
  .intro-skip { position: absolute; bottom: 22px; right: 22px; font-family: var(--f-ui); font-size: .8rem; color: #666; }
  @media (prefers-reduced-motion: reduce) { .intro-on .intro { display: none; } }


  .headline, .note-title, .quick p { overflow-wrap: break-word; }

  /* Foto de la nota: solo en computadora */
  .foto { margin: 28px 0 0; max-width: 760px; }
  .foto img { display: block; width: 100%; height: clamp(240px, 38vh, 440px); object-fit: cover; object-position: center 22%; background: var(--paper-2); }
  .foto figcaption { margin-top: 6px; font-family: var(--f-ui); font-size: .8rem; color: var(--ink-2); }
  .foto a { color: var(--ink); text-underline-offset: 3px; }

  /* Notas de opinión (margen derecho): la columna llega hasta abajo, con su línea, como la de la izquierda */
  .opinion { grid-area: opinion; min-width: 0; border-inline-start: 2px solid var(--ink); }
  .opinion-in { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100dvh; overflow: auto; padding: 8px 0 24px clamp(18px, 2.4vw, 32px); }
  .opinion h2 { display: inline-block; margin: 0 0 8px; padding: 5px 11px; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
  .opinion .sub { margin: 0 0 14px; font-family: var(--f-ui); font-size: .8rem; color: var(--ink-2); }
  .opinion ol { list-style: none; margin: 0; padding: 0; }
  .op { padding: 14px 0; border-top: 1px solid var(--line); }
  .op:first-child { border-top: 2px solid var(--ink); }
  .op-medio { font-family: var(--f-ui); font-size: .78rem; color: var(--ink-2); }
  .op-titulo { display: block; margin: 4px 0 6px; font-family: var(--f-display); font-weight: 700; font-size: .95rem; line-height: 1.25; overflow-wrap: break-word; }
  .op-autor { font-family: var(--f-ui); font-size: .82rem; font-weight: 600; margin: 0 0 4px; }
  .op-texto { margin: 0 0 8px; font-family: var(--f-ui); font-size: .88rem; line-height: 1.45; color: var(--ink-2); }
  .op a { color: var(--ink); text-underline-offset: 3px; font-family: var(--f-ui); font-size: .85rem; font-weight: 600; }
  .op a.op-titulo { text-decoration: none; font-size: .95rem; font-weight: 700; }
  .op a.op-titulo:hover { text-decoration: underline; }
  .opinion .vacio { font-family: var(--f-ui); font-size: .88rem; color: var(--ink-2); margin: 0; border-top: 2px solid var(--ink); padding-top: 14px; }
  .ir-opinion { display: none; }

  /* Pantallas medianas: la columna pasa a una franja destacada arriba de todo, con tarjetas que se deslizan */
  @media (max-width: 1023px) and (min-width: 881px) {
    .shell { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); grid-template-areas: "opinion opinion" "mast lead" "list lead"; grid-template-rows: auto auto 1fr; }
    .opinion { border-inline-start: 0; border-bottom: 2px solid var(--ink); margin-bottom: 18px; padding-bottom: 14px; }
    .opinion-in { position: static; max-height: none; overflow: visible; padding: 0; }
    .opinion ol { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
    .op, .op:first-child { flex: 0 0 290px; scroll-snap-align: start; border-top: 2px solid var(--ink); }
  }

  @media (max-width: 880px) {
    .shell { grid-template-columns: minmax(0, 1fr); grid-template-areas: "mast" "lead" "opinion" "list"; grid-template-rows: auto; }
    .opinion { border-inline-start: 0; border-block: 3px solid var(--ink); background: var(--paper-2); margin: 22px calc(-1 * clamp(16px, 3vw, 40px)) 0; padding: 16px clamp(16px, 3vw, 40px) 18px; }
    .opinion-in { position: static; max-height: none; overflow: visible; padding: 0; }
    .opinion ol { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
    .op, .op:first-child { flex: 0 0 min(82%, 320px); scroll-snap-align: start; background: var(--paper); border: 1px solid var(--ink); border-top: 3px solid var(--ink); padding: 12px; }
    .opinion .vacio { border-top: 0; padding-top: 0; }
    .ir-opinion:not([hidden]) { display: inline-block; justify-self: start; padding: 8px 12px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font-family: var(--f-ui); font-size: .85rem; font-weight: 600; text-decoration: none; }
    .mast, .list { padding-inline-end: 0; border-inline-end: 0; }
    .list { border-top: 2px solid var(--ink); margin-top: 16px; }
    .lead { position: static; max-height: none; overflow: visible; padding-block: 24px 8px; padding-inline-start: 0; }
    .headline { max-width: none; }
    .foto { display: none; }
    .brand-name { font-size: 2.7rem; }
    .shell { padding-block: 16px 32px; }
    .filters button { padding: 10px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .note-btn { transition: none; }
  }
</style>
</head>

<script>
(function () {
  var data = JSON.parse(document.getElementById('news-data').textContent);
  var SECTIONS = { cordoba: 'Córdoba', argentina: 'Argentina', economia: 'Economía y finanzas' };
  var FILTERS = [['todas', 'Todas'], ['cordoba', 'Córdoba'], ['argentina', 'Argentina'], ['economia', 'Economía']];
  function ts(n) { var t = Date.parse(n.fecha); return isNaN(t) ? 0 : t; }
  // Listado en orden cronológico (lo más nuevo arriba); la nota del día es la más relevante de las últimas 24 h
  var notes = data.notas.slice().sort(function (a, b) { return ts(b) - ts(a) || b.relevancia - a.relevancia; });
  var masRelevante = data.notas.slice().sort(function (a, b) { return b.relevancia - a.relevancia; })[0];
  var leadId = masRelevante && masRelevante.id;
  var state = { filter: 'todas', selected: leadId };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function marker(s) { var m = el('span', 'mk'); m.dataset.s = s; return m; }
  function safeUrl(u) {
    try { var x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; }
    catch (e) { return null; }
  }
  function diaTxt(n) { return n.dia === 1 ? 'Ayer ' : (n.dia === 2 ? 'Anteayer ' : (n.dia >= 3 ? 'Hace ' + n.dia + ' días ' : '')); }

  function encuadrar(img, ro) {
    var nw = img.naturalWidth, nh = img.naturalHeight, bw = img.clientWidth;
    if (!nw || !nh || !bw) return;
    // La foto ocupa lo que queda de pantalla debajo del texto, para verse completa sin scrollear
    var lead = document.getElementById('lead');
    var yTop = img.getBoundingClientRect().top + (lead ? lead.scrollTop : 0) - (lead ? lead.getBoundingClientRect().top : 0);
    var libreVista = window.innerHeight - yTop - 64;
    img.style.height = Math.max(230, Math.min(480, libreVista)) + 'px';
    var bh = img.clientHeight;
    if (!bh) return;
    var hs = nh * bw / nw;                 // alto de la foto ya escalada al ancho de la caja
    var y0 = ro.y0 * hs, y1 = ro.y1 * hs, top;
    if (y1 - y0 > bh) {                    // los rostros no entran: se agranda la caja (hasta 480 px)
      bh = Math.min(y1 - y0, hs, 480);
      img.style.height = bh + 'px';
    }
    var libre = hs - bh;                   // cuánto sobra para desplazar
    if (libre <= 0) { img.style.objectPosition = 'center top'; return; }
    if (y1 - y0 <= bh) top = (y0 + y1) / 2 - bh / 2;  // el rostro entra: centrarlo
    else top = y0;                                    // no entra: priorizar la cara desde la frente
    top = Math.max(0, Math.min(libre, top));
    img.style.objectPosition = 'center ' + (top / libre * 100).toFixed(1) + '%';
  }

  function safeImg(u) {
    if (/^fotos\/[\w.\-]+$/.test(u)) return u;  // foto propia del sitio
    try { var x = new URL(u); return x.protocol === 'https:' ? x.href : null; }
    catch (e) { return null; }
  }
  var desktop = window.matchMedia('(min-width: 881px)');
  function byId(id) { return notes.filter(function (n) { return n.id === id; })[0]; }

  // Fecha
  var when = new Date(data.actualizado);
  var f = when.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'America/Argentina/Cordoba' });
  var h = when.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Argentina/Cordoba' });
  document.getElementById('dateline').textContent = f + '. Actualizado a las ' + h + '.';

  function renderFilters() {
    var ul = document.getElementById('filters');
    ul.textContent = '';
    FILTERS.forEach(function (p) {
      var count = p[0] === 'todas' ? notes.length : notes.filter(function (n) { return n.seccion === p[0]; }).length;
      var li = el('li');
      var b = el('button', null, p[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state.filter === p[0]));
      b.appendChild(el('span', 'n', String(count)));
      b.addEventListener('click', function () { state.filter = p[0]; renderFilters(); renderList(); });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  function renderList() {
    var ol = document.getElementById('notes');
    ol.textContent = '';
    notes.filter(function (n) { return state.filter === 'todas' || n.seccion === state.filter; })
      .forEach(function (n) {
        var li = el('li');
        var b = el('button', 'note-btn');
        b.type = 'button';
        if (n.id === state.selected) b.setAttribute('aria-current', 'true');
        var top = el('span', 'note-top');
        top.appendChild(marker(n.seccion));
        top.appendChild(el('span', null, SECTIONS[n.seccion] || n.seccion));
        top.appendChild(el('span', 'hora', diaTxt(n) + (n.hora || '')));
        b.appendChild(top);
        b.appendChild(el('span', 'note-title', n.titulo));
        b.appendChild(el('span', 'note-src', n.fuente + (n.acceso === 'suscripcion' ? ' (con suscripción)' : '')));
        b.addEventListener('click', function () {
          state.selected = n.id;
          renderList();
          renderLead();
          if (window.matchMedia('(max-width: 880px)').matches) {
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            document.getElementById('lead').scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
          }
        });
        li.appendChild(b);
        ol.appendChild(li);
      });
  }

  function renderLead() {
    var n = byId(state.selected);
    var box = document.getElementById('lead');
    box.textContent = '';
    if (!n) return;
    var isLead = n.id === leadId;

    var k = el('div', 'kicker');
    k.appendChild(marker(n.seccion));
    k.appendChild(el('span', null, isLead ? 'Nota del día' : 'Nota seleccionada'));
    if (!isLead) {
      var back = el('button', 'back', 'Volver a la nota del día');
      back.type = 'button';
      back.addEventListener('click', function () { state.selected = leadId; renderList(); renderLead(); });
      k.appendChild(back);
    }
    box.appendChild(k);

    box.appendChild(el('h2', 'headline', n.titulo));

    var meta = el('div', 'meta');
    var sec = el('span', 'sec');
    sec.appendChild(marker(n.seccion));
    sec.appendChild(el('span', null, SECTIONS[n.seccion] || n.seccion));
    meta.appendChild(sec);
    meta.appendChild(el('span', 'src', n.fuente));
    if (n.hora) meta.appendChild(el('span', null, diaTxt(n) + n.hora + ' h'));
    if (n.acceso === 'suscripcion') meta.appendChild(el('span', 'badge', 'Con suscripción: solo titular y resumen breve'));
    box.appendChild(meta);

    var words = (n.resumen || '').trim().split(/\s+/).filter(Boolean).length;
    var secs = Math.max(5, Math.round(words / 3.3));
    var quick = el('section', 'block quick');
    var qh = el('h3', null, 'Lectura rápida');
    qh.appendChild(el('span', 't', 'unos ' + secs + ' segundos'));
    quick.appendChild(qh);
    quick.appendChild(el('p', null, n.resumen || ''));
    box.appendChild(quick);

    if (n.impacto) {
      var imp = el('section', 'block impact');
      imp.appendChild(el('h3', null, 'Impacto en las finanzas'));
      imp.appendChild(el('p', null, n.impacto));
      box.appendChild(imp);
    }

    if (n.otros && n.otros.length) {
      var oth = el('section', 'block otros');
      oth.appendChild(el('h3', null, 'También lo cubren'));
      var ul = el('ul');
      n.otros.forEach(function (o) {
        var li = el('li');
        var h = o.url ? safeUrl(o.url) : null;
        var label = o.fuente + (o.titulo ? ': ' + o.titulo : '');
        if (h) {
          var a = el('a', null, label);
          a.href = h; a.target = '_blank'; a.rel = 'noopener noreferrer';
          li.appendChild(a);
        } else {
          li.appendChild(el('span', null, label));
        }
        ul.appendChild(li);
      });
      oth.appendChild(ul);
      box.appendChild(oth);
    }

    var act = el('div', 'actions');
    var href = n.url ? safeUrl(n.url) : null;
    if (href) {
      var a = el('a', 'go', 'Leer la nota completa en ' + n.fuente);
      a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      act.appendChild(a);
    } else {
      var d = el('span', 'go', 'El enlace a la nota original va acá');
      d.setAttribute('aria-disabled', 'true');
      act.appendChild(d);
    }
    box.appendChild(act);
    box.appendChild(el('p', 'legal', 'Extracto publicado por el medio. Para la nota completa, usar el enlace de arriba.'));

    // La foto se pide solo en computadora; en el celular no se descarga
    var src = n.imagen && desktop.matches ? safeImg(n.imagen) : null;
    if (src) {
      var fig = el('figure', 'foto');
      var img = el('img');
      img.alt = 'Imagen de la nota';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', function () { fig.remove(); });
      // Si se detectaron rostros, se encuadra para que se vean enteros
      var ro = n.rostros;
      if (!(ro && typeof ro.y0 === 'number' && typeof ro.y1 === 'number')) ro = { y0: 0.05, y1: 0.35 };  // sin rostros: favorecer la parte de arriba
      if (ro) {
        img.addEventListener('load', function () { encuadrar(img, ro); });
        window.addEventListener('resize', function () { if (img.complete) encuadrar(img, ro); });
      }
      img.src = src;
      fig.appendChild(img);
      var cap = el('figcaption', null, 'Imagen: ' + (n.imagen_credito || n.fuente) + '. ');
      if (href) {
        var ver = el('a', null, 'Ver la nota original');
        ver.href = href; ver.target = '_blank'; ver.rel = 'noopener noreferrer';
        cap.appendChild(ver);
      }
      fig.appendChild(cap);
      box.appendChild(fig);
    }
  }

  function renderOpinion() {
    var ol = document.getElementById('op-lista');
    var box = document.getElementById('opinion');
    ol.textContent = '';
    var lista = Array.isArray(data.opinion) ? data.opinion : [];
    var viejo = box.querySelector('.vacio'); if (viejo) viejo.remove();
    var chip = document.getElementById('ir-opinion');
    if (chip) { chip.hidden = !lista.length; if (lista.length) chip.textContent = 'Notas de opinión (' + lista.length + ') ↓'; }
    if (!lista.length) {
      var p = el('p', 'vacio', 'Todavía no hay notas de opinión marcadas.');
      box.querySelector('.opinion-in').appendChild(p);
      return;
    }
    lista.forEach(function (o) {
      var href = safeUrl(o.url);
      if (!href) return;
      var li = el('li', 'op');
      li.appendChild(el('div', 'op-medio', 'Opinión · ' + (o.medio || '')));
      var t = el('a', 'op-titulo', o.titulo);
      t.href = href; t.target = '_blank'; t.rel = 'noopener noreferrer';
      li.appendChild(t);
      if (o.autor) li.appendChild(el('p', 'op-autor', 'Por ' + o.autor));
      if (o.resumen) li.appendChild(el('p', 'op-texto', o.resumen));
      var a = el('a', null, 'Leer en ' + (o.medio || 'el medio') + ' →');
      a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      li.appendChild(a);
      ol.appendChild(li);
    });
  }

  renderFilters(); renderList(); renderLead(); renderOpinion();
  if (desktop.addEventListener) desktop.addEventListener('change', renderLead);
})();
</script>
</body>
