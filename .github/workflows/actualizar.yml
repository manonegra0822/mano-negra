name: Actualizar notas

on:
  # Todos los días a las 08:00, 13:00 y 20:00 de Argentina (11:00, 16:00 y 23:00 UTC)
  schedule:
    - cron: "0 11,16,23 * * *"
  # Cada vez que se cambia la lista de medios, las palabras o la curaduría
  push:
    paths:
      - sources.json
      - keywords.json
      - curaduria.json
      - build.py
      - render.py
      - plantilla.html
      - sitio.json
      - assets/**
      - intro/**
      - fotos/**
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub atrasa mucho sus horarios programados (a veces 6-8 horas). El disparo puntual lo hace
      # una tarea programada externa; el horario de GitHub queda solo de respaldo y no corre de madrugada
      # ni si ya hubo una actualización en las últimas 4 horas.
      - name: Ver si hace falta actualizar
        id: ver
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt, os
          from zoneinfo import ZoneInfo
          ahora = dt.datetime.now(ZoneInfo("America/Argentina/Cordoba"))
          seguir = "si"
          if os.environ.get("EVENTO") == "schedule":
              try:
                  ult = dt.datetime.fromisoformat(json.load(open("estado.json"))["actualizado"])
                  reciente = (ahora - ult).total_seconds() < 4 * 3600
              except Exception:
                  reciente = False
              if reciente or not (7 <= ahora.hour < 23):
                  seguir = "no"
          print("seguir=" + seguir)
          PY
        env:
          EVENTO: ${{ github.event_name }}

      - name: Instalar detector de rostros (para encuadrar las fotos)
        if: steps.ver.outputs.seguir == 'si'
        run: pip install numpy pillow scikit-image

      - name: Actualizar dólar y riesgo país (si la fuente no responde, queda el último valor)
        if: steps.ver.outputs.seguir == 'si'
        run: python dolar.py || true

      - name: Armar las notas del día
        if: steps.ver.outputs.seguir == 'si'
        run: python build.py

      - name: Guardar cambios
        if: steps.ver.outputs.seguir == 'si'
        run: |
          git config user.name "mano-negra-bot"
          git config user.email "mano-negra-bot@users.noreply.github.com"
          git add index.html news.json estado.json dolar.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualizar notas"
          # Si mientras tanto se publicó otra actualización, se suma a ella y se rearma la página
          for intento in 1 2 3; do
            if git pull --rebase -X theirs && python render.py && git add index.html && (git diff --cached --quiet || git commit --amend --no-edit) && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
