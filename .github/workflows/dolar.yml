name: Actualizar dólar

on:
  # Todos los días a las 10:30 (apertura del mercado de cambios, 10:00) y a las 15:00
  # de Argentina (13:30 y 18:00 UTC).
  # GitHub puede demorar unos minutos en arrancar las tareas programadas.
  schedule:
    - cron: "30 13 * * *"   # 10:30
    - cron: "10 14 * * *"   # respaldo 11:10 (solo corre si la anterior no llegó a ejecutarse)
    - cron: "50 14 * * *"   # respaldo 11:50
    - cron: "0 18 * * *"    # 15:00
    - cron: "40 18 * * *"   # respaldo 15:40
    - cron: "20 19 * * *"   # respaldo 16:20
  # Botón "Run workflow" en la pestaña Actions
  workflow_dispatch:

permissions:
  contents: write

# Mismo grupo que la actualización de notas: nunca corren las dos a la vez
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  dolar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar el dólar oficial y rearmar la página
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python dolar.py --si-falta; else python dolar.py; fi

      - name: Guardar cambios
        run: |
          git config user.name "mano-negra-bot"
          git config user.email "mano-negra-bot@users.noreply.github.com"
          git add dolar.json index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualizar dólar"
          # Si mientras tanto se publicó otra actualización, se suma a ella y se rearma la página
          for intento in 1 2 3; do
            if git pull --rebase -X theirs && python render.py && git add index.html && (git diff --cached --quiet || git commit --amend --no-edit) && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
